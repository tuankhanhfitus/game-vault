<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Account Vault - Cloud Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <!-- Firebase SDKs (Compat version) -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              900: '#090d16',
              800: '#0f172a',
              700: '#1e293b',
              600: '#334155',
              neon: '#06b6d4',
              accent: '#8b5cf6'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f1f5f9; }
    .font-gaming { font-family: 'Chakra Petch', sans-serif; }
    .neon-glow:hover { box-shadow: 0 0 20px rgba(139, 92, 246, 0.35); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- MÀN HÌNH KHÓA & ĐỒNG BỘ ĐÁM MÂY -->
  <div id="lockScreen" class="fixed inset-0 z-50 bg-[#090d16] flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-cyber-800 border border-slate-700/80 rounded-2xl p-6 sm:p-8 shadow-2xl relative">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i data-lucide="cloud-lock" class="w-9 h-9 text-white"></i>
        </div>
        <h1 class="text-2xl font-bold font-gaming tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">
          GAME VAULT CLOUD
        </h1>
        <p class="text-xs text-slate-400 mt-1">Đồng bộ đám mây kết hợp mã hóa AES-256</p>
      </div>

      <div class="flex border-b border-slate-700 mb-4 text-xs font-semibold">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400">Đăng Nhập</button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-2 text-slate-400 hover:text-white">Đăng Ký</button>
      </div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Tài khoản Email</label>
          <input type="email" id="cloudEmail" required placeholder="name@example.com"
            class="w-full px-3.5 py-2.5 bg-cyber-900 border border-slate-700 rounded-xl text-white text-sm focus:border-cyan-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Mật khẩu Firebase</label>
          <input type="password" id="cloudPassword" required placeholder="Tối thiểu 6 ký tự"
            class="w-full px-3.5 py-2.5 bg-cyber-900 border border-slate-700 rounded-xl text-white text-sm focus:border-cyan-500 focus:outline-none">
        </div>

        <div class="pt-2 border-t border-slate-700/60">
          <label class="block text-xs font-semibold uppercase text-emerald-400 mb-1">
            Master Password (Khóa giải mã AES) *
          </label>
          <input type="password" id="masterPasswordInput" required placeholder="Khóa bảo vệ kho dữ liệu"
            class="w-full px-3.5 py-2.5 bg-cyber-900 border border-emerald-500/50 rounded-xl text-white text-sm focus:border-emerald-400 focus:outline-none">
          <p class="text-[11px] text-slate-400 mt-1 leading-snug">Chỉ bạn biết mật khẩu này. Dữ liệu sẽ được mã hóa trên máy trước khi tải lên Firebase.</p>
        </div>

        <p id="authErrorMsg" class="text-xs text-rose-400 hidden"></p>

        <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-semibold rounded-xl text-sm transition flex items-center justify-center gap-2">
          <span>Đăng Nhập & Đồng Bộ</span>
        </button>
      </form>
    </div>
  </div>

  <!-- THANH ĐIỀU HƯỚNG CHÍNH -->
  <header class="border-b border-slate-800 bg-cyber-800/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center">
          <i data-lucide="gamepad-2" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <span class="text-lg font-bold font-gaming text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 leading-none block">
            GAME VAULT
          </span>
          <span id="userStatusTag" class="text-[11px] text-emerald-400 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Đồng bộ Cloud
          </span>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <label for="excelFileInput" class="cursor-pointer px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-1.5">
          <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-400"></i>
          <span class="hidden sm:inline">Nhập Excel</span>
        </label>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">

        <button onclick="lockVault()" class="px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-1.5">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Đăng xuất</span>
        </button>
      </div>
    </div>
  </header>

  <!-- NỘI DUNG CHÍNH -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">
    <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
      <div class="flex flex-1 flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          <input type="text" id="searchInput" oninput="renderAccounts()" placeholder="Tìm theo game, user, email, SĐT..."
            class="w-full pl-10 pr-4 py-2.5 bg-cyber-800 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
        </div>
        <select id="gameFilterSelect" onchange="renderAccounts()" class="px-3.5 py-2.5 bg-cyber-800 border border-slate-700 rounded-xl text-sm text-slate-300">
          <option value="ALL">Tất cả Game</option>
        </select>
      </div>
      <button onclick="openModal()" class="px-4 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-xl text-sm flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>Thêm Tài Khoản</span>
      </button>
    </div>

    <div id="accountsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <div id="emptyState" class="hidden text-center py-16">
      <i data-lucide="inbox" class="w-12 h-12 mx-auto text-slate-500 mb-3"></i>
      <h3 class="text-base font-semibold text-slate-300">Chưa có tài khoản nào trên đám mây</h3>
      <p class="text-xs text-slate-500 mt-1 mb-4">Hãy tải file Excel hoặc bấm Thêm Tài Khoản để đồng bộ ngay.</p>
    </div>
  </main>

  <!-- MODAL THÊM / SỬA -->
  <div id="accountModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="w-full max-w-lg bg-cyber-800 border border-slate-700 rounded-2xl p-6 shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
        <h3 id="modalTitle" class="text-lg font-bold font-gaming text-cyan-400">Thêm Tài Khoản</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form onsubmit="saveAccount(event)" class="space-y-3">
        <input type="hidden" id="editAccountId">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Game *</label>
            <input type="text" id="accGame" required class="w-full px-3 py-2 bg-cyber-900 border border-slate-700 rounded-xl text-sm text-white focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">User *</label>
            <input type="text" id="accUser" required class="w-full px-3 py-2 bg-cyber-900 border border-slate-700 rounded-xl text-sm text-white focus:border-cyan-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Mật khẩu *</label>
          <input type="text" id="accPass" required class="w-full px-3 py-2 bg-cyber-900 border border-slate-700 rounded-xl text-sm font-mono text-white focus:border-cyan-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Email</label>
            <input type="text" id="accEmail" class="w-full px-3 py-2 bg-cyber-900 border border-slate-700 rounded-xl text-sm text-white focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Số điện thoại</label>
            <input type="text" id="accPhone" class="w-full px-3 py-2 bg-cyber-900 border border-slate-700 rounded-xl text-sm text-white focus:border-cyan-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Ghi chú</label>
          <textarea id="accNotes" rows="2" class="w-full px-3 py-2 bg-cyber-900 border border-slate-700 rounded-xl text-sm text-white focus:border-cyan-500"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-700">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-sm">Hủy</button>
          <button type="submit" class="px-5 py-2 bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-xl text-sm">Lưu & Đẩy Lên Cloud</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 z-50 bg-cyber-700 border border-slate-600 text-white px-4 py-2 rounded-xl text-sm transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <span id="toastMsg">Thành công</span>
  </div>

  <script>
    // ========================================================
    // CẤU HÌNH FIREBASE TỰ ĐỘNG ĐƯỢC ĐIỀN CHÍNH XÁC:
    // ========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCE96cqlhrxIdRFLGFbcOnFpeH0wVob8TU",
      authDomain: "game-vault-cloud-e29eb.firebaseapp.com",
      projectId: "game-vault-cloud-e29eb",
      storageBucket: "game-vault-cloud-e29eb.firebasestorage.app",
      messagingSenderId: "838807435904",
      appId: "1:838807435904:web:42c8b91fc76bea46eb8465"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let masterKey = null;
    let accounts = [];
    let isRegisterMode = false;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function switchAuthTab(mode) {
      isRegisterMode = (mode === 'register');
      document.getElementById('tabLoginBtn').className = isRegisterMode ? 'flex-1 py-2 text-slate-400' : 'flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400';
      document.getElementById('tabRegisterBtn').className = !isRegisterMode ? 'flex-1 py-2 text-slate-400' : 'flex-1 py-2 text-cyan-400 border-b-2 border-cyan-400';
      document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Đăng Ký Tài Khoản Mới' : 'Đăng Nhập & Đồng Bộ';
      document.getElementById('authErrorMsg').classList.add('hidden');
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('cloudEmail').value.trim();
      const password = document.getElementById('cloudPassword').value;
      const masterPass = document.getElementById('masterPasswordInput').value;
      const errorEl = document.getElementById('authErrorMsg');

      try {
        errorEl.classList.add('hidden');
        if (isRegisterMode) {
          const res = await auth.createUserWithEmailAndPassword(email, password);
          currentUser = res.user;
        } else {
          const res = await auth.signInWithEmailAndPassword(email, password);
          currentUser = res.user;
        }
        masterKey = masterPass;
        await syncFromCloud();
        document.getElementById('lockScreen').classList.add('hidden');
        showToast('Đã kết nối và đồng bộ đám mây!');
      } catch (err) {
        errorEl.innerText = err.message;
        errorEl.classList.remove('hidden');
      }
    }

    async function syncFromCloud() {
      if (!currentUser || !masterKey) return;
      const docRef = db.collection('vaults').doc(currentUser.uid);
      const docSnap = await docRef.get();

      if (docSnap.exists) {
        const encrypted = docSnap.data().payload;
        try {
          const bytes = CryptoJS.AES.decrypt(encrypted, masterKey);
          const decrypted = bytes.toString(CryptoJS.enc.Utf8);
          if (!decrypted) throw new Error();
          accounts = JSON.parse(decrypted);
        } catch (e) {
          alert('Sai Master Password! Không thể giải mã dữ liệu.');
          accounts = [];
        }
      } else {
        accounts = [];
      }
      updateGameFilter();
      renderAccounts();
    }

    async function pushToCloud() {
      if (!currentUser || !masterKey) return;
      const jsonStr = JSON.stringify(accounts);
      const encrypted = CryptoJS.AES.encrypt(jsonStr, masterKey).toString();

      await db.collection('vaults').doc(currentUser.uid).set({
        payload: encrypted,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function lockVault() {
      auth.signOut();
      currentUser = null;
      masterKey = null;
      accounts = [];
      document.getElementById('accountsGrid').innerHTML = '';
      document.getElementById('lockScreen').classList.remove('hidden');
      showToast('Đã đăng xuất.');
    }

    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: '' });

          let headerIdx = -1, col = { g: -1, u: -1, p: -1, e: -1, ph: -1, n: -1 };
          for (let r = 0; r < rows.length; r++) {
            const row = rows[r].map(c => String(c).trim().toLowerCase());
            const g = row.findIndex(c => c.includes('game'));
            const u = row.findIndex(c => c.includes('user'));
            const p = row.findIndex(c => c.includes('pass'));
            if (g !== -1 && (u !== -1 || p !== -1)) {
              headerIdx = r;
              col.g = g; col.u = u; col.p = p;
              col.e = row.findIndex(c => c.includes('email') || c.includes('mail'));
              col.ph = row.findIndex(c => c.includes('phone') || c.includes('sđt'));
              col.n = row.findIndex(c => c.includes('note') || c.includes('ghi'));
              break;
            }
          }

          if (headerIdx === -1) {
            showToast('Không tìm thấy cột Game Name / User / Password!');
            return;
          }

          let added = 0;
          for (let r = headerIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            const game = col.g !== -1 ? String(row[col.g] || '').trim() : '';
            const user = col.u !== -1 ? String(row[col.u] || '').trim() : '';
            if (game || user) {
              accounts.push({
                id: 'acc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                game: game || 'Khác',
                user: user,
                password: col.p !== -1 ? String(row[col.p] || '').trim() : '',
                email: col.e !== -1 ? String(row[col.e] || '').trim() : '',
                phone: col.ph !== -1 ? String(row[col.ph] || '').trim() : '',
                notes: col.n !== -1 ? String(row[col.n] || '').trim() : ''
              });
              added++;
            }
          }

          if (added > 0) {
            await pushToCloud();
            updateGameFilter();
            renderAccounts();
            showToast(`Đã tải lên đám mây ${added} tài khoản!`);
          }
        } catch (err) {
          showToast('Lỗi đọc Excel: ' + err.message);
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function updateGameFilter() {
      const select = document.getElementById('gameFilterSelect');
      const val = select.value;
      const games = [...new Set(accounts.map(a => a.game).filter(Boolean))].sort();
      select.innerHTML = '<option value="ALL">Tất cả Game</option>';
      games.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g; opt.innerText = g;
        select.appendChild(opt);
      });
      select.value = val;
    }

    function renderAccounts() {
      const grid = document.getElementById('accountsGrid');
      const empty = document.getElementById('emptyState');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const fg = document.getElementById('gameFilterSelect').value;

      const filtered = accounts.filter(a => {
        const mg = (fg === 'ALL') || (a.game === fg);
        const mq = !q || a.game.toLowerCase().includes(q) || a.user.toLowerCase().includes(q) || (a.email && a.email.toLowerCase().includes(q));
        return mg && mq;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(a => `
        <div class="bg-cyber-800 border border-slate-700/80 rounded-2xl p-4 flex flex-col justify-between neon-glow">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="font-bold text-base text-cyan-400 font-gaming">${a.game}</span>
              <div class="flex gap-1">
                <button onclick="editAccount('${a.id}')" class="p-1 text-slate-400 hover:text-cyan-300"><i data-lucide="edit" class="w-4 h-4"></i></button>
                <button onclick="deleteAccount('${a.id}')" class="p-1 text-slate-400 hover:text-rose-400"><i data-lucide="trash" class="w-4 h-4"></i></button>
              </div>
            </div>
            <div class="bg-cyber-900 p-2.5 rounded-xl border border-slate-800 text-xs space-y-1">
              <div class="flex justify-between">
                <span class="text-slate-400">User:</span>
                <span class="font-mono text-slate-200 select-all">${a.user}</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-slate-400">Pass:</span>
                <span class="font-mono text-cyan-300 select-all">${a.password}</span>
              </div>
              ${a.email ? `<div class="flex justify-between"><span class="text-slate-400">Mail:</span><span class="text-slate-300 select-all">${a.email}</span></div>` : ''}
              ${a.phone ? `<div class="flex justify-between"><span class="text-slate-400">SĐT:</span><span class="text-slate-300 select-all">${a.phone}</span></div>` : ''}
            </div>
            ${a.notes ? `<p class="text-[11px] text-slate-400 mt-2 bg-slate-900/40 p-1.5 rounded border border-slate-800">${a.notes}</p>` : ''}
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function openModal(editId = null) {
      document.getElementById('editAccountId').value = editId || '';
      document.getElementById('modalTitle').innerText = editId ? 'Cập Nhật Tài Khoản' : 'Thêm Tài Khoản';
      if (editId) {
        const item = accounts.find(a => a.id === editId);
        document.getElementById('accGame').value = item.game;
        document.getElementById('accUser').value = item.user;
        document.getElementById('accPass').value = item.password;
        document.getElementById('accEmail').value = item.email || '';
        document.getElementById('accPhone').value = item.phone || '';
        document.getElementById('accNotes').value = item.notes || '';
      } else {
        document.getElementById('accGame').value = '';
        document.getElementById('accUser').value = '';
        document.getElementById('accPass').value = '';
        document.getElementById('accEmail').value = '';
        document.getElementById('accPhone').value = '';
        document.getElementById('accNotes').value = '';
      }
      document.getElementById('accountModal').classList.remove('hidden');
      document.getElementById('accountModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('accountModal').classList.add('hidden');
      document.getElementById('accountModal').classList.remove('flex');
    }

    async function saveAccount(e) {
      e.preventDefault();
      const id = document.getElementById('editAccountId').value;
      const data = {
        game: document.getElementById('accGame').value.trim(),
        user: document.getElementById('accUser').value.trim(),
        password: document.getElementById('accPass').value,
        email: document.getElementById('accEmail').value.trim(),
        phone: document.getElementById('accPhone').value.trim(),
        notes: document.getElementById('accNotes').value.trim()
      };

      if (id) {
        const idx = accounts.findIndex(a => a.id === id);
        accounts[idx] = { ...accounts[idx], ...data };
      } else {
        accounts.unshift({ id: 'acc_' + Date.now(), ...data });
      }

      await pushToCloud();
      closeModal();
      updateGameFilter();
      renderAccounts();
      showToast('Đã lưu và đồng bộ lên đám mây!');
    }

    async function deleteAccount(id) {
      if (confirm('Xóa tài khoản này khỏi đám mây?')) {
        accounts = accounts.filter(a => a.id !== id);
        await pushToCloud();
        updateGameFilter();
        renderAccounts();
        showToast('Đã xóa.');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
    }
  </script>
</body>
</html>
